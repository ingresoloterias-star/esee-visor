<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cámaras">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<title>Cámaras</title>
<style>
  :root { --bg:#0b0d10; --tile:#14181d; --line:#262c34; --text:#e8ecf1; --dim:#8b96a3; --accent:#3ea6ff; --glass:rgba(12,15,19,.62); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }

  #grid { position:fixed; inset:0; padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); display:grid; gap:8px; grid-template-columns:repeat(var(--cols,3),1fr); grid-auto-rows:1fr; overflow:auto; }
  .tile { position:relative; background:var(--tile); border:2px solid var(--line); border-radius:10px; overflow:hidden; min-height:0; cursor:pointer; outline:none; aspect-ratio:auto; }
  .tile.sel { border-color:var(--accent); box-shadow:0 0 0 3px rgba(62,166,255,.28); }
  .tile .name, #title { position:absolute; left:8px; top:8px; padding:3px 9px; border-radius:6px; background:var(--glass); font-weight:600; font-size:13px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .state { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; pointer-events:none; text-align:center; padding:12px; }
  .state.hide { display:none; }
  @media (orientation:portrait) and (max-width:700px) { #grid { --cols:1 !important; grid-auto-rows:max-content; align-content:start; } .tile { height:calc((100vw - 16px) * 9 / 16); } }

  #single { position:fixed; inset:0; background:#000; display:none; }
  #single.on { display:block; }
  #back { position:absolute; left:max(12px,env(safe-area-inset-left)); top:max(12px,env(safe-area-inset-top)); height:38px; min-width:38px; padding:0 10px; font-size:15px; border-radius:10px; touch-action:manipulation; }
  #title { left:calc(max(12px,env(safe-area-inset-left)) + 46px); top:calc(max(12px,env(safe-area-inset-top)) + 7px); font-size:15px; }
  .ui { transition:opacity .25s; }
  #single.idle .ui { opacity:0; pointer-events:none; }
  .btn { background:var(--glass); color:var(--text); border:1px solid rgba(255,255,255,.16); border-radius:12px; font:600 15px system-ui,sans-serif; min-width:52px; height:52px; padding:0 14px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); touch-action:none; }
  .btn:active, .btn.down { background:var(--accent); color:#001a33; }
  .btn.on { border-color:var(--accent); color:var(--accent); }
  #top { position:absolute; right:max(12px,env(safe-area-inset-right)); top:max(12px,env(safe-area-inset-top)); display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:calc(100vw - 170px); }
  #top .btn { height:38px; min-width:38px; padding:0 10px; font-size:13px; border-radius:10px; touch-action:manipulation; }
  #settings { font-size:19px !important; }
  #camSettings { position:fixed; inset:0; z-index:12; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.68); }
  #camSettings.open { display:flex; }
  #camSettingsPanel { width:min(380px,100%); padding:20px; border:1px solid rgba(255,255,255,.16); border-radius:18px; background:#14181d; box-shadow:0 18px 60px rgba(0,0,0,.55); }
  #camSettingsHead { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; }
  #camSettingsTitle { margin:0; font-size:18px; font-weight:650; }
  #camSettingsClose { min-width:38px; width:38px; height:38px; padding:0; touch-action:manipulation; }
  #ptzSpeedLabel { display:flex; justify-content:space-between; gap:12px; font-weight:600; }
  #ptzSpeedValue { color:var(--accent); font-variant-numeric:tabular-nums; }
  #ptzSpeed { display:block; width:100%; margin:18px 0 8px; accent-color:var(--accent); touch-action:pan-x; }
  #ptzSpeedScale { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; }
  #camSettingsNote { margin:18px 0 0; color:var(--dim); font-size:13px; }
  #eweSection { margin-top:20px; border-top:1px solid rgba(255,255,255,.1); padding-top:18px; }
  #eweTitle { font-weight:600; margin-bottom:10px; }
  #eweStatus { color:var(--dim); font-size:13px; margin-bottom:12px; }
  #eweStatus a { color:var(--accent); }
  #eweConfig { display:none; flex-direction:column; gap:12px; }
  .eweField { display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--dim); }
  .eweField select, .eweField input { font:15px system-ui,sans-serif; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  #eweButtons { display:flex; gap:8px; margin-top:4px; }
  #eweButtons .btn { height:42px; padding:0 16px; touch-action:manipulation; }
  #updSection { margin-top:20px; border-top:1px solid rgba(255,255,255,.1); padding-top:16px; }
  #updBtn { height:42px; padding:0 16px; touch-action:manipulation; }
  #updMsg { color:var(--dim); font-size:13px; margin-top:8px; min-height:1.2em; }
  #pad { position:absolute; right:max(16px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; }
  #pad .btn { width:56px; height:56px; min-width:0; padding:0; font-size:20px; }
  #zoom { position:absolute; left:max(16px,env(safe-area-inset-left)); bottom:max(16px,env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; }
  #zoom span { color:var(--dim); font-size:12px; margin-right:2px; }
  #hint { position:absolute; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); transform:translateX(-50%); color:var(--dim); font-size:12px; background:var(--glass); padding:4px 10px; border-radius:6px; white-space:nowrap; }
  @media (max-width:700px) { #hint { display:none; } }
  #rec { position:absolute; left:0; right:0; bottom:0; display:none; flex-direction:column; gap:6px; padding:26px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); background:linear-gradient(transparent,rgba(0,0,0,.82) 38%); }
  #single.rec #rec { display:flex; }
  #single.rec #pad, #single.rec #zoom, #single.rec #hint, #single.rec #hd, #single.rec #mic, #single.rec #settings { display:none !important; }
  #top .btn.live { background:#e5484d; border-color:#e5484d; color:#fff; }
  #micCfg { position:absolute; right:max(12px,env(safe-area-inset-right)); top:calc(max(12px,env(safe-area-inset-top)) + 46px); display:none; flex-wrap:wrap; justify-content:flex-end; gap:6px; align-items:center; background:var(--glass); padding:6px 8px; border-radius:12px; font-size:13px; max-width:calc(100vw - 24px); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #micCfg .btn { height:34px; min-width:34px; padding:0 9px; font-size:13px; border-radius:9px; touch-action:manipulation; }
  #micCfg b { min-width:14px; text-align:center; }
  #micLevel { width:54px; height:8px; border-radius:4px; background:#262c34; overflow:hidden; }
  #micLevel i { display:block; height:100%; width:0; background:#4ade80; }
  #rec .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #rec .sp { flex:1; }
  .btn.sm { height:40px; min-width:40px; padding:0 11px; font-size:13px; border-radius:10px; touch-action:manipulation; }
  .btn:disabled { opacity:.35; }
  #rDate { font-weight:600; min-width:78px; text-align:center; }
  #datePicker { position:fixed; inset:0; z-index:15; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.72); }
  #datePicker.open { display:flex; }
  #datePickerPanel { width:min(340px,100%); padding:16px; border:1px solid rgba(255,255,255,.16); border-radius:16px; background:#14181d; box-shadow:0 18px 60px rgba(0,0,0,.55); }
  #datePickerHead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  #datePickerMonth { flex:1; text-align:center; font-weight:650; text-transform:capitalize; }
  #datePickerGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  #datePickerGrid button { min-width:0; height:40px; padding:0; touch-action:manipulation; }
  #datePickerGrid .weekday { height:28px; color:var(--dim); font-size:12px; }
  #datePickerGrid .chosen { border-color:var(--accent); color:var(--accent); }
  #datePickerGrid .empty { visibility:hidden; }
  #rClock { font:600 20px ui-monospace,Menlo,Consolas,monospace; margin-left:8px; }
  #rSpan { color:var(--dim); font-size:12px; min-width:44px; text-align:center; }
  #tl { width:100%; height:58px; display:block; border-radius:8px; touch-action:none; cursor:pointer; }
  #recKey { color:var(--dim); font-size:11px; }
  #recKey i { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px; vertical-align:-1px; }
  #clipTools { color:var(--dim); font-size:12px; }
  #clipStatus { color:var(--accent); }
  #clipProgress { width:120px; height:10px; accent-color:var(--accent); vertical-align:middle; }
  #clipAudio { display:inline-flex; align-items:center; gap:5px; color:var(--dim); font-size:12px; white-space:nowrap; }
  #clipAudio input { width:18px; height:18px; margin:0; accent-color:var(--accent); }
  #lock { position:fixed; inset:0; background:var(--bg); z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; }
  #lock.on { display:flex; }
  #lock .btn { height:56px; padding:0 26px; font-size:17px; touch-action:manipulation; }
  #lockMsg { color:var(--dim); font-size:14px; min-height:1.4em; }
  #lock .btn { min-width:220px; }
  #lockForm { flex-direction:column; align-items:center; gap:12px; }
  #lockPin { font:600 24px ui-monospace,Menlo,Consolas,monospace; letter-spacing:.3em; text-align:center; width:220px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--tile); color:var(--text); outline:none; -webkit-user-select:text; user-select:text; }
  #lockPin:focus { border-color:var(--accent); }
  #faceBar { position:fixed; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:4; display:none; gap:8px; align-items:center; background:rgba(12,15,19,.92); border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:8px 8px 8px 14px; font-size:14px; white-space:nowrap; }
  #faceBar .btn { height:40px; font-size:14px; touch-action:manipulation; white-space:nowrap; flex:none; }
  #faceBar span { min-width:0; }
  #ver { position:fixed; right:max(10px,env(safe-area-inset-right)); bottom:max(6px,env(safe-area-inset-bottom)); color:#aeb8c4; font-size:12px; pointer-events:none; z-index:3; background:rgba(12,15,19,.75); padding:2px 7px; border-radius:6px; }
  #single.on ~ #faceChip, #single.on ~ #ver, #single.on ~ #faceBar { display:none !important; }
  #acts { position:absolute; left:max(12px,env(safe-area-inset-left)); top:calc(max(12px,env(safe-area-inset-top)) + 48px); display:flex; flex-direction:column; gap:8px; align-items:flex-start; z-index:2; }
  #acts .btn { height:44px; padding:0 16px; font-size:15px; touch-action:manipulation; }
  #acts .btn.ask { background:#ffb020; color:#221300; border-color:#ffb020; }
  #single.rec #acts { display:none; }
  #faceChip { position:fixed; left:max(10px,env(safe-area-inset-left)); bottom:max(6px,env(safe-area-inset-bottom)); z-index:3; display:none; background:rgba(12,15,19,.85); color:var(--accent); border:1px solid rgba(62,166,255,.5); border-radius:8px; font:600 12px system-ui,sans-serif; padding:5px 10px; cursor:pointer; touch-action:manipulation; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="single">
  <video id="big" muted playsinline autoplay></video>
  <div class="state" id="bigState">Conectando…</div>
  <button class="btn ui" id="back" title="Volver">✕</button>
  <div id="title" class="ui"></div>
  <div id="acts" class="ui"></div>
  <div id="top" class="ui">
    <button class="btn" id="mic" title="Hablar por el parlante de la cámara" style="display:none">Hablar</button>
    <button class="btn" id="snd" title="Sonido">Audio</button>
    <button class="btn" id="recBtn" title="Grabaciones">Grab.</button>
    <button class="btn" id="pip" style="display:none">PiP</button>
    <button class="btn" id="settings" title="Ajustes de cámara" aria-label="Ajustes de cámara">⚙</button>
    <button class="btn" id="hd">HD</button>
  </div>
  <div id="micCfg">
    <div id="micLevel" title="Nivel del micrófono"><i></i></div>
    <span>Sensibilidad</span><button class="btn" id="msDown">−</button><b id="msVal">3</b><button class="btn" id="msUp">+</button>
    <button class="btn" id="msDuck"></button>
    <button class="btn" id="msHold"></button>
    <button class="btn" id="msMode"></button>
  </div>
  <div id="zoom" class="ui">
    <span>Zoom</span>
    <button class="btn" data-ptz="zoomOut">−</button>
    <button class="btn" data-ptz="zoomIn">+</button>
  </div>
  <div id="pad" class="ui">
    <span></span><button class="btn" data-ptz="up">▲</button><span></span>
    <button class="btn" data-ptz="left">◀</button><span></span><button class="btn" data-ptz="right">▶</button>
    <span></span><button class="btn" data-ptz="down">▼</button><span></span>
  </div>
  <div id="rec" class="ui">
    <div class="row">
      <button class="btn sm" id="rDayPrev">◀</button><button class="btn sm" id="rDate" title="Elegir fecha" aria-label="Elegir fecha"></button><button class="btn sm" id="rDayNext">▶</button>
      <span id="rClock">--:--:--</span>
      <span id="recKey"><i style="background:#2f6fbd"></i>grabado<i style="background:#ff9d2e"></i>movimiento</span>
      <span class="sp"></span>
      <button class="btn sm" id="rZoomOut">−</button><span id="rSpan">24 h</span><button class="btn sm" id="rZoomIn">+</button>
    </div>
    <canvas id="tl"></canvas>
    <div class="row">
      <button class="btn sm" id="rPrevEv">⏮ Mov.</button>
      <button class="btn sm" id="rBack">−10 s</button>
      <button class="btn sm" id="rPlay">⏸</button>
      <button class="btn sm" id="rFwd">+10 s</button>
      <button class="btn sm" id="rNextEv">Mov. ⏭</button>
      <button class="btn sm" id="rSpeed">1x</button>
      <span class="sp"></span>
      <button class="btn sm" id="rLive">En vivo</button>
    </div>
    <div class="row" id="clipTools">
      <button class="btn sm" id="clipStart">Marcar inicio</button>
      <span id="clipStartAt">Inicio: —</span>
      <button class="btn sm" id="clipEnd">Marcar fin</button>
      <span id="clipEndAt">Fin: —</span>
      <label id="clipAudio"><input id="clipWithAudio" type="checkbox">Incluir audio</label>
      <button class="btn sm" id="clipDownload" disabled>Descargar tramo</button>
      <progress id="clipProgress" max="100" value="0" hidden></progress>
      <span id="clipStatus" role="status"></span>
    </div>
  </div>
  <div id="hint" class="ui">Flechas: mover · OK: calidad · +/−: zoom · Atrás: volver</div>
</div>
<div id="datePicker" aria-hidden="true">
  <section id="datePickerPanel" role="dialog" aria-modal="true" aria-labelledby="datePickerMonth">
    <div id="datePickerHead"><button class="btn sm" id="datePrevMonth" aria-label="Mes anterior">◀</button><span id="datePickerMonth"></span><button class="btn sm" id="dateNextMonth" aria-label="Mes siguiente">▶</button><button class="btn sm" id="datePickerClose" aria-label="Cerrar calendario">✕</button></div>
    <div id="datePickerGrid"></div>
  </section>
</div>
<div id="camSettings" aria-hidden="true">
  <section id="camSettingsPanel" role="dialog" aria-modal="true" aria-labelledby="camSettingsTitle">
    <div id="camSettingsHead">
      <h2 id="camSettingsTitle">Ajustes de cámara</h2>
      <button class="btn" id="camSettingsClose" aria-label="Cerrar ajustes">✕</button>
    </div>
    <label id="ptzSpeedLabel" for="ptzSpeed"><span>Velocidad PTZ</span><output id="ptzSpeedValue">4</output></label>
    <input id="ptzSpeed" type="range" min="1" max="8" step="1" value="4">
    <div id="ptzSpeedScale"><span>Lenta</span><span>Rápida</span></div>
    <p id="camSettingsNote">Se guarda para esta cámara y se comparte con los demás dispositivos.</p>
    <div id="eweSection">
      <div id="eweTitle">Botón para abrir (reja / portón)</div>
      <div id="eweStatus"></div>
      <div id="eweConfig">
        <label class="eweField"><span>Dispositivo</span><select id="eweDevice"></select></label>
        <label class="eweField"><span>Texto del botón</span><input id="eweLabel" type="text" maxlength="24" placeholder="Abrir reja"></label>
        <label class="eweField"><span>Al tocar</span><select id="eweDo"><option value="pulse">Pulso (abre y suelta)</option><option value="toggle">Alternar</option><option value="on">Encender</option><option value="off">Apagar</option></select></label>
        <div id="eweButtons"><button class="btn on" id="eweSave">Guardar botón</button><button class="btn" id="eweRemove">Quitar</button></div>
      </div>
    </div>
    <div id="updSection">
      <button class="btn" id="updBtn">Buscar actualización del visor</button>
      <div id="updMsg"></div>
    </div>
  </section>
</div>
<button id="faceChip">Activar Face ID</button>
<div id="faceBar"><span>Entrar con tu cara</span><button class="btn on" id="faceOn">Activar Face ID</button><button class="btn" id="faceNo">Ahora no</button></div>
<div id="lock"><div style="font-size:20px;font-weight:600">Cámaras</div><button class="btn on" id="lockBtn">Entrar con Face ID</button><button class="btn" id="lockPinBtn">Entrar con PIN</button><form id="lockForm" style="display:none"><input id="lockPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="btn on">Entrar</button></form><div id="lockMsg"></div></div>
<div id="ver"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const MS = window.ManagedMediaSource || window.MediaSource;

// ---------- Reproductor: una pantalla de video ----------
// Siempre guarda lo último recibido (formato, inicio y fragmentos desde el último cuadro clave),
// pero solo decodifica cuando está "activo" (a la vista). Así un celular no intenta
// decodificar todas las cámaras a la vez, y al activarse arranca al instante.
class Sink {
  constructor(video, stateEl) {
    this.video = video; this.stateEl = stateEl; this.ms = null; this.sb = null; this.queue = [];
    this.meta = null; this.initSeg = null; this.gop = []; this.active = true; this.fails = 0; this.failAt = 0;
    this.n = { seek: 0, wait: 0, stall: 0, err: 0, build: 0, appendErr: 0, bytes: 0 };
    video.addEventListener('waiting', () => this.n.wait++); video.addEventListener('stalled', () => this.n.stall++); video.addEventListener('error', () => this.n.err++);
  }
  stats() {
    const v = this.video, b = v.buffered, r = [];
    for (let i = 0; i < b.length && i < 4; i++) r.push(+b.start(i).toFixed(2) + '-' + +b.end(i).toFixed(2));
    const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : {};
    return Object.assign({ a: this.active ? 1 : 0, t: +v.currentTime.toFixed(2), rs: v.readyState, p: v.paused ? 1 : 0, w: v.videoWidth, nr: b.length, r: r.join(' '), fr: q.totalVideoFrames, dr: q.droppedVideoFrames, e: v.error ? v.error.code + ':' + v.error.message : undefined, le: this.lastErr, fails: this.fails }, this.n);
  }
  say(t) { if (this.stateEl) { this.stateEl.textContent = t || ''; this.stateEl.classList.toggle('hide', !t); } }

  // Apaga el decodificador (no borra lo guardado)
  teardown() {
    clearTimeout(this.recoverTimer);
    this.ms = null; this.sb = null; this.queue = [];
    try { this.video.pause(); } catch (e) {}
    if (this.url) { URL.revokeObjectURL(this.url); this.url = null; }
    this.video.removeAttribute('src'); try { this.video.load(); } catch (e) {}
  }
  // Olvida todo (al cortar la conexión)
  clear() { this.teardown(); this.meta = null; this.initSeg = null; this.gop = []; this.fails = 0; this.gaveUp = false; }

  setActive(on) {
    if (this.active === on) return;
    this.active = on;
    if (on) { this.gaveUp = false; this.fails = 0; this.build(); } else this.teardown();
  }

  // Arma el decodificador con lo guardado
  build() {
    this.teardown();
    if (!this.active || !this.meta || !this.initSeg || this.gaveUp) return;
    const v = this.video, mime = `video/mp4; codecs="${this.meta.codec}"`;
    if (!MS.isTypeSupported(mime)) { this.gaveUp = true; this.say('Este dispositivo no reproduce ' + this.meta.codec); return; }
    this.n.build++;
    const ms = this.ms = new MS();
    if (window.ManagedMediaSource) v.disableRemotePlayback = true;
    this.url = URL.createObjectURL(ms); v.src = this.url;
    ms.addEventListener('sourceopen', () => {
      if (this.ms !== ms) return;
      try { this.sb = ms.addSourceBuffer(mime); } catch (e) { this.lastErr = 'addSourceBuffer: ' + e; this.fail(); return; }

    if (v.playbackRate !== SPEEDS[rec.speed]) v.playbackRate = SPEEDS[rec.speed];
    if (rec.playing && v.paused) v.play().catch(() => {});
    if (!sb.updating && v.currentTime - start > 45) { try { sb.remove(start, v.currentTime - 20); } catch (e) {} }
    if (rec.pendingT === null && rec.scrubW0 === null) rec.cursor = recWall();
    if (rec.ended && end - v.currentTime < 0.3) bigSink.say('Fin de lo grabado');
    if (rec.cursor >= rec.day + 86400) { rec.day += 86400; rec.segs = []; rec.events = []; recLoadDay(); }
  }
  if (rec.day + 86400 > recNow() && Date.now() - rec.listAt > 60000) { rec.listAt = Date.now(); recLoadDay(); } // hoy sigue creciendo
  recAudioTick();
  recDraw();
}

async function recEnter() {
  if (cur < 0 || rec.on) return;
  ptzStop(); micStop(); if (bigConn) { bigConn.stop(); bigConn = null; }
  rec.on = true; rec.gen++; rec.zoom = 0; rec.speed = 0; rec.pendingT = null; rec.scrubW0 = null; rec.segs = []; rec.events = []; rec.clipStart = rec.clipEnd = null; clipUpdate();
  single.classList.add('rec'); $('#rSpeed').textContent = '1x'; recSetPlaying(true);
  rec.nowBase = Date.now() / 1000 - new Date().getTimezoneOffset() * 60; rec.nowAt = performance.now();
  rec.day = Math.floor(rec.nowBase / 86400) * 86400; rec.cursor = rec.target = rec.nowBase - 90;
  clearInterval(rec.timer); rec.timer = setInterval(recTick, 250);
  recDraw();
  await recLoadDay();
  if (rec.on) recPlay(recNow() - 90); // arrancar un minuto y medio atrás
}
function recExit(resumeLive = true) {
  if (!rec.on) return;
  rec.on = false; rec.gen++; clearInterval(rec.timer); clearTimeout(nudgeTimer);
  if (rec.abort) rec.abort.abort();
  recAudioReset(true); bigV.playbackRate = 1; bigSink.clear(); single.classList.remove('rec');
  if (resumeLive && cur >= 0) playBig();
}

$('#recBtn').addEventListener('click', () => (rec.on ? recExit() : recEnter()));
$('#rLive').addEventListener('click', () => recExit());
$('#rPlay').addEventListener('click', () => recSetPlaying(!rec.playing));
$('#rBack').addEventListener('click', () => recNudge(-10));
$('#rFwd').addEventListener('click', () => recNudge(10));
$('#rPrevEv').addEventListener('click', () => recEvent(-1));
$('#rNextEv').addEventListener('click', () => recEvent(1));
$('#rSpeed').addEventListener('click', () => { rec.speed = (rec.speed + 1) % SPEEDS.length; $('#rSpeed').textContent = SPEEDS[rec.speed] + 'x'; bigV.playbackRate = SPEEDS[rec.speed]; });
$('#rZoomIn').addEventListener('click', () => { rec.zoom = Math.min(SPANS.length - 1, rec.zoom + 1); recDraw(); });
$('#rZoomOut').addEventListener('click', () => { rec.zoom = Math.max(0, rec.zoom - 1); recDraw(); });
$('#rDayPrev').addEventListener('click', () => recSetDay(rec.day - 86400));
$('#rDayNext').addEventListener('click', () => { if (rec.day + 86400 <= recNow()) recSetDay(rec.day + 86400); });
let calYear = 0, calMonth = 0;
function datePickerRender() {
  const grid = $('#datePickerGrid'); grid.replaceChildren();
  const monthStart = new Date(Date.UTC(calYear, calMonth, 1));
  $('#datePickerMonth').textContent = monthStart.toLocaleDateString('es-AR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  for (const d of ['D', 'L', 'M', 'M', 'J', 'V', 'S']) {
    const el = document.createElement('span'); el.className = 'btn sm weekday'; el.textContent = d; grid.appendChild(el);
  }
  for (let i = 0; i < monthStart.getUTCDay(); i++) { const empty = document.createElement('span'); empty.className = 'btn sm empty'; grid.appendChild(empty); }
  const count = new Date(Date.UTC(calYear, calMonth + 1, 0)).getUTCDate();
  const today = new Date(recNow() * 1000), todayN = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()) / 86400000;
  const selected = Math.floor(rec.day / 86400);
  for (let day = 1; day <= count; day++) {
    const stamp = Date.UTC(calYear, calMonth, day) / 86400000;
    const button = document.createElement('button'); button.className = 'btn sm'; button.type = 'button'; button.textContent = String(day);
    button.disabled = stamp > todayN;
    if (stamp === selected) button.classList.add('chosen');
    button.setAttribute('aria-label', new Date(Date.UTC(calYear, calMonth, day)).toLocaleDateString('es-AR', { dateStyle: 'full', timeZone: 'UTC' }));
    button.addEventListener('click', () => { recSetDay(stamp * 86400); datePickerClose(); });
    grid.appendChild(button);
  }
  $('#dateNextMonth').disabled = calYear === today.getUTCFullYear() && calMonth >= today.getUTCMonth();
}
function datePickerOpen() {
  const d = new Date(rec.day * 1000); calYear = d.getUTCFullYear(); calMonth = d.getUTCMonth();
  datePickerRender(); $('#datePicker').classList.add('open'); $('#datePicker').setAttribute('aria-hidden', 'false');
}
function datePickerClose() { $('#datePicker').classList.remove('open'); $('#datePicker').setAttribute('aria-hidden', 'true'); }
$('#rDate').addEventListener('click', datePickerOpen);
$('#datePickerClose').addEventListener('click', datePickerClose);
$('#datePicker').addEventListener('click', (e) => { if (e.target.id === 'datePicker') datePickerClose(); });
$('#datePrevMonth').addEventListener('click', () => { if (--calMonth < 0) { calMonth = 11; calYear--; } datePickerRender(); });
$('#dateNextMonth').addEventListener('click', () => { if (++calMonth > 11) { calMonth = 0; calYear++; } datePickerRender(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#datePicker').classList.contains('open')) { e.preventDefault(); datePickerClose(); } });
$('#clipStart').addEventListener('click', () => { rec.clipStart = recWall(); $('#clipStatus').textContent = ''; clipUpdate(); });
$('#clipEnd').addEventListener('click', () => { rec.clipEnd = recWall(); $('#clipStatus').textContent = ''; clipUpdate(); });
$('#clipDownload').addEventListener('click', clipDownload);
// arrastrar sobre la línea de tiempo
function tlTime(e) { const r = tl.getBoundingClientRect(), [w0, span] = recWindow(); return w0 + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * span; }
tl.addEventListener('pointerdown', (e) => { e.preventDefault(); tl.setPointerCapture(e.pointerId); rec.scrubW0 = recWindow()[0]; rec.pendingT = tlTime(e); recDraw(); });
tl.addEventListener('pointermove', (e) => { if (rec.scrubW0 === null) return; rec.pendingT = tlTime(e); recDraw(); });
const tlUp = () => { if (rec.scrubW0 === null) return; const t = rec.pendingT; rec.scrubW0 = null; rec.pendingT = null; if (t !== null) recSeek(t); };
tl.addEventListener('pointerup', tlUp); tl.addEventListener('pointercancel', tlUp);
window.addEventListener('resize', recDraw);

function recKey(e) { // teclado / control remoto en modo grabaciones
  if ($('#datePicker').classList.contains('open')) { if (e.key === 'Escape') datePickerClose(); return; }
  const k = e.key;
  if (k === 'ArrowLeft') recNudge(e.repeat ? -30 : -10); else if (k === 'ArrowRight') recNudge(e.repeat ? 30 : 10);
  else if (k === 'ArrowUp') { if (!e.repeat) recEvent(1); } else if (k === 'ArrowDown') { if (!e.repeat) recEvent(-1); }
  else if (k === 'Enter' || k === ' ' || k === 'MediaPlayPause') { if (!e.repeat) recSetPlaying(!rec.playing); }
  else if (k === '+' || k === '=') $('#rZoomIn').click(); else if (k === '-') $('#rZoomOut').click();
  else if (k === 'MediaFastForward') { if (!e.repeat) $('#rSpeed').click(); } else if (k === 'MediaRewind') recNudge(-60);
  else if (k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack') recExit();
  else return;
  e.preventDefault();
}

// ---------- Face ID / huella (llave de acceso) ----------
const b64u = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
const faceOK = !!(window.isSecureContext && window.PublicKeyCredential && navigator.credentials);
async function faceLogin() { // pide la cara y abre sesión; devuelve true si entró
  const ch = await (await fetch('/api/passkey/challenge', { cache: 'no-store' })).json();
  if (!ch.ids.length) throw new Error('Este dispositivo todavía no tiene Face ID activado');
  const cred = await navigator.credentials.get({ publicKey: { challenge: unb64u(ch.challenge), rpId: ch.rpId, allowCredentials: ch.ids.map((id) => ({ type: 'public-key', id: unb64u(id) })), userVerification: 'required', timeout: 60000 } });
  const r = await fetch('/api/passkey/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: b64u(cred.rawId), clientDataJSON: b64u(cred.response.clientDataJSON), authenticatorData: b64u(cred.response.authenticatorData), signature: b64u(cred.response.signature) }) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'No se pudo entrar');
  return true;
}
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const sess = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
async function faceRegister() { // crea la llave en este dispositivo y la guarda en el servidor
  const ch = await (await fetch('/api/passkey/challenge', { cache: 'no-store' })).json();
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: unb64u(ch.challenge), rp: { name: 'Cámaras', id: ch.rpId },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'camaras', displayName: 'Cámaras' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    excludeCredentials: ch.ids.map((id) => ({ type: 'public-key', id: unb64u(id) })),
    authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' }, attestation: 'none', timeout: 60000 } });
  const name = /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone / iPad' : /Android/.test(navigator.userAgent) ? 'Android' : 'computadora';
  const r = await fetch('/api/passkey/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: b64u(cred.rawId), publicKey: b64u(cred.response.getPublicKey()), alg: cred.response.getPublicKeyAlgorithm(), clientDataJSON: b64u(cred.response.clientDataJSON), name }) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'el servidor respondió ' + r.status);
  store.set('faceId', b64u(cred.rawId)); sess.set('unlocked', '1');
}
function faceOffer(pinOn) { // ofrecer activar Face ID una vez, si el dispositivo puede
  if (!pinOn || !faceOK || store.get('faceId')) return;
  const bar = $('#faceBar'), chip = $('#faceChip');
  // si antes eligió "Ahora no", queda un botón chico abajo a la izquierda para activarlo cuando quiera
  const showBar = (on) => { bar.style.display = on ? 'flex' : 'none'; chip.style.display = on ? 'none' : 'block'; };
  showBar(!store.get('faceSkip'));
  chip.onclick = () => showBar(true);
  $('#faceNo').onclick = () => { store.set('faceSkip', '1'); showBar(false); };
  $('#faceOn').onclick = async () => {
    const label = bar.querySelector('span'); label.style.color = ''; label.textContent = 'Registrando…';
    const done = () => { label.textContent = 'Face ID activado'; chip.style.display = 'none'; setTimeout(() => { bar.style.display = 'none'; }, 1500); };
    try { await faceRegister(); done(); }
    catch (e0) {
      let e = e0;
      if (e0.name === 'InvalidStateError') { // este dispositivo ya tenía la llave guardada: usarla en vez de crear otra
        try { await faceLogin(); store.set('faceId', '1'); sess.set('unlocked', '1'); return done(); } catch (e1) { e = e1; }
      }
      // mostrar siempre el motivo, y avisarle al servidor para poder diagnosticarlo
      const why = e.name === 'NotAllowedError' ? 'cancelado o no permitido por el dispositivo (' + e.message + ')' : (e.name && e.name !== 'Error' ? e.name + ': ' : '') + e.message;
      bar.style.whiteSpace = 'normal'; bar.style.maxWidth = '92vw'; label.style.color = '#ff8a7a'; label.textContent = 'No se activó: ' + why;
      fetch('/api/diag', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ faceError: why, ua: navigator.userAgent, origin: location.origin }) }).catch(() => {});
    }
  };
}
// Bloqueo: con Face ID activado, la app pide la cara cada vez que se abre
let hiddenAt = 0;
function lockNeeded() { return faceOK && !!store.get('faceId') && sess.get('unlocked') !== '1'; }
let unlocking = false;
function unlocked() { sess.set('unlocked', '1'); $('#lock').classList.remove('on'); boot(); }
async function unlock() {
  if (unlocking) return; // nunca dos pedidos de Face ID a la vez
  unlocking = true;
  const msg = $('#lockMsg'); msg.textContent = '';
  try { await faceLogin(); unlocked(); }
  catch (e) { msg.textContent = e.name === 'NotAllowedError' ? 'Elegí cómo entrar' : e.message; }
  unlocking = false;
}
$('#lockBtn').addEventListener('click', unlock);
// Alternativa: entrar con el PIN, por si Face ID falla o no se quiere usar
$('#lockPinBtn').addEventListener('click', () => { $('#lockForm').style.display = 'flex'; $('#lockPinBtn').style.display = 'none'; $('#lockPin').focus(); });
$('#lockForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = $('#lockMsg'); msg.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('#lockPin').value }) });
    if (r.ok) { $('#lockPin').value = ''; return unlocked(); }
    msg.textContent = (await r.json().catch(() => ({}))).error || 'No se pudo entrar';
  } catch (e) { msg.textContent = 'Sin conexión con el servidor'; }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  // al volver después de 5 minutos fuera, pedir la cara otra vez (salvo que haya quedado en imagen flotante)
  if (store.get('faceId') && hiddenAt && Date.now() - hiddenAt > 300000 && !inPip()) { sess.del('unlocked'); location.reload(); }
});

// ---------- Arranque y actualización automática ----------
async function info() { const r = await fetch('/api/info', { cache: 'no-store' }); if (r.status === 401) { location.reload(); throw new Error('pin'); } return r.json(); }
async function boot() {
  try {
    const i = await info(); version = i.version; cameras = i.cameras; $('#ver').textContent = 'v' + version;
    buildGrid();
    const camParam = new URLSearchParams(location.search).get('cam');
    const requestedCam = camParam === null ? NaN : Number(camParam);
    if (Number.isInteger(requestedCam) && requestedCam >= 0 && requestedCam < cameras.length) {
      select(requestedCam); openCam(requestedCam, false);
    } else startGrid();
    faceOffer(i.pin);
  } catch (e) { grid.innerHTML = '<div class="state">No se pudo conectar con el servidor. Reintentando…</div>'; setTimeout(boot, 3000); }
}
setInterval(() => {
  if (document.hidden) return;
  const sinks = cur >= 0 ? [bigSink] : tiles.map((t) => t.sink);
  const body = JSON.stringify({ ua: navigator.userAgent, mms: !!window.ManagedMediaSource, mse: !!window.MediaSource, view: cur >= 0 ? "una" : "grilla", size: innerWidth + "x" + innerHeight, s: sinks.map((x) => x.stats()) });
  fetch("/api/diag", { method: "POST", headers: { "Content-Type": "application/json" }, body }).catch(() => {});
}, 5000);
setInterval(async () => { try { const i = await info(); if (version && i.version !== version) location.reload(); else if (!camSettings.classList.contains('open')) cameras = i.cameras; } catch (e) {} }, 60000);
if (lockNeeded()) { $('#lock').classList.add('on'); unlock(); } else boot();
</script>
